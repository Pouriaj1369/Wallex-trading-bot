name: Wallex Paper Trading

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run paper bot
        run: python paper_bot2.py
